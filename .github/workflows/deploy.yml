name: Deploy on Main PushAdd commentMore actions

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy (example using SSH)
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      source ~/.nvm/nvm.sh
                      cd /var/www/html/apiV2/Admin_api
                      git pull origin main
                      npm install
                      pm2 reload 24
